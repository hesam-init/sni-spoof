name: Build binaries

on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  # Manual runs: one matrix job per CLI binary (same pattern as build-gui).
  build-cli:
    name: Build CLI (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            make_target: windows-amd64
            asset_target: cli-asset-windows-amd64
          - target: windows-arm64
            make_target: windows-arm64
            asset_target: cli-asset-windows-arm64
          - target: linux-amd64
            make_target: linux-amd64
            asset_target: cli-asset-linux-amd64
          - target: linux-arm64
            make_target: linux-arm64
            asset_target: cli-asset-linux-arm64
          - target: linux-armv7
            make_target: linux-armv7
            asset_target: cli-asset-linux-armv7
          - target: linux-mipsle
            make_target: linux-mipsle
            asset_target: cli-asset-linux-mipsle
          - target: linux-mips
            make_target: linux-mips
            asset_target: cli-asset-linux-mips
          - target: darwin-amd64
            make_target: darwin-amd64
            asset_target: cli-asset-darwin-amd64
          - target: darwin-arm64
            make_target: darwin-arm64
            asset_target: cli-asset-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build CLI
        run: make ${{ matrix.make_target }}

      - name: Hash artifact
        id: stage
        run: |
          set -euo pipefail
          asset="$(make -s ${{ matrix.asset_target }})"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          sha256sum "$asset"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sni-spoofing-${{ matrix.target }}
          path: ${{ steps.stage.outputs.asset }}

  # Releases: one job builds every CLI target and uploads to the GitHub release.
  build-cli-release:
    name: Build CLI (all platforms, release)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build all CLI targets
        run: make dist

      - name: Create checksums
        run: make dist-checksums

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  build-gui:
    name: Build GUI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            make_target: gui-linux-amd64
            asset_target: gui-asset-linux-amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            make_target: gui-linux-arm64
            asset_target: gui-asset-linux-arm64
          - target: windows-amd64
            runner: ubuntu-latest
            make_target: gui-windows-amd64
            asset_target: gui-asset-windows-amd64
          - target: windows-arm64
            runner: ubuntu-latest
            make_target: gui-windows-arm64
            asset_target: gui-asset-windows-arm64
          - target: darwin-universal
            runner: macos-latest
            make_target: gui-darwin-universal
            asset_target: gui-asset-darwin-universal
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux' && (matrix.make_target == 'gui-linux-amd64' || matrix.make_target == 'gui-linux-arm64')
        run: make deps-linux

      - name: Build GUI
        run: make ${{ matrix.make_target }}

      - name: Hash artifact
        id: stage
        run: |
          set -euo pipefail
          asset="$(make -s ${{ matrix.asset_target }})"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset"
          else
            shasum -a 256 "$asset"
          fi

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sni-spoofing-gui-${{ matrix.target }}
          path: ${{ steps.stage.outputs.asset }}

      - name: Upload assets to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.stage.outputs.asset }}" --clobber

  build-and-push-image:
    name: Build and push multi-arch Docker image
    runs-on: ubuntu-latest
    needs: build-cli-release
    if: always() && (needs.build-cli-release.result == 'success' || needs.build-cli-release.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for release
        if: github.event_name == 'release'
        id: meta-release
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sni-spoofing-go
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Extract metadata (tags, labels) for manual trigger
        if: github.event_name == 'workflow_dispatch'
        id: meta-manual
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sni-spoofing-go
          tags: |
            type=raw,value=${{ github.ref_name }}-{{sha}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ github.event_name == 'release' && steps.meta-release.outputs.tags || steps.meta-manual.outputs.tags }}
          labels: ${{ github.event_name == 'release' && steps.meta-release.outputs.labels || steps.meta-manual.outputs.labels }}
